name: products-service

services:
  products-service-db:
    container_name: products-service-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-products_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASS:-postgres}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - products_db_data:/var/lib/postgresql/data
    networks:
      - products-service-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USER:-postgres}', '-d', '${DB_NAME:-products_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  products_db_data:

networks:
  products-service-network:
    driver: bridge
